# SUSPENDED configuration for luzenarestaurant.com: every address, the dashboard included,
# answers 503 with the "Payment needed" page. Hand-written; switched on and off by
# deploy/suspend/suspend.sh, which swaps it with the normal configuration in sites-enabled.
#
# The live release under /var/www/luzenarestaurant.com/current is not touched, so turning
# the suspension off puts the exact same site back.

# http:// goes to https:// on the bare domain (unchanged, so certificate renewal keeps working).
server {
    listen 80;
    listen [::]:80;
    server_name luzenarestaurant.com www.luzenarestaurant.com;

    location /.well-known/acme-challenge/ {
        root /var/www/luzenarestaurant.com/acme;
    }
    location / {
        return 301 https://luzenarestaurant.com$request_uri;
    }
}

# www goes to the bare domain (unchanged).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.luzenarestaurant.com;

    ssl_certificate /etc/letsencrypt/live/luzenarestaurant.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luzenarestaurant.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    return 301 https://luzenarestaurant.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name luzenarestaurant.com;

    ssl_certificate /etc/letsencrypt/live/luzenarestaurant.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luzenarestaurant.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Holds payment-needed.html only. Never the live release.
    root /var/www/luzenarestaurant.com/suspended;
    charset utf-8;

    # 503 tells browsers and search engines the outage is temporary, so the site keeps its
    # place in search results. A direct request for the page itself gets the same answer.
    error_page 503 /payment-needed.html;
    error_page 404 =503 /payment-needed.html;

    location = /payment-needed.html {
        internal;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # Never cached, so the real site is back for every visitor the moment it is restored.
        add_header Cache-Control "no-store" always;
        add_header Retry-After "86400" always;
    }

    location / {
        return 503;
    }
}
